<title>The Corleone Family: Steadfast Rotation</title>
<style>
  :root{
    --bg: #0d0c0c;
    --panel: #1c1a1a;
    --panel-line: #33201f;
    --line: #332c2c;
    --line-strong: #4a3d3d;
    --ink: #efe6dc;
    --ink-dim: #b9ada0;
    --ink-faint: #857a70;
    --inactive-ink: #a4988b;
    --inactive-line: #3f3434;
    --red: #c6272d;
    --red-strong: #e2393f;
    --red-wash: #2c1414;
    --accent: #c9c1b8;
    --accent-strong: #ddd6ce;
    --accent-wash: #262322;
    --stat-str: #e2393f;
    --stat-str-wash: #2c1413;
    --stat-spd: #d6cf5e;
    --stat-spd-wash: #24230f;
    --stat-def: #7ea0c9;
    --stat-def-wash: #171f26;
    --stat-dex: #8fae7a;
    --stat-dex-wash: #171f18;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 40px rgba(0,0,0,.55);
  }

  *{ box-sizing: border-box; }
  body{
    background: var(--bg);
    background-image: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(198,39,45,.10), transparent);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 40px 16px 80px;
  }
  .sheet{ max-width: 760px; margin: 0 auto; }

  .banner{
    background: #000;
    border: 1px solid var(--panel-line);
    box-shadow: var(--shadow), inset 0 0 0 1px rgba(198,39,45,.15);
    border-radius: 3px;
    padding: 30px 20px 24px;
    text-align: center;
    margin-bottom: 20px;
  }
  .kicker{
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 12px;
  }
  h1{
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 32px;
    text-transform: uppercase;
    letter-spacing: .03em;
    color: var(--red-strong);
    text-shadow: 0 0 22px rgba(226,57,63,.35);
    margin: 0 0 8px;
    text-wrap: balance;
    line-height: 1.15;
  }
  .subtitle{
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 13.5px;
    color: var(--accent-strong);
  }

  .section-title{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px 16px;
    padding-bottom: 10px;
    margin: 26px 0 14px;
    border-bottom: 2px solid var(--red);
  }
  .section-title:first-of-type{ margin-top: 4px; }
  .section-title h2{
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 18px;
    text-transform: uppercase;
    letter-spacing: .03em;
    color: var(--red-strong);
    margin: 0;
  }
  .section-title span.hint{
    font-size: 11px;
    color: var(--ink-faint);
  }

  /* Bonus tiers strip */
  .bonus-strip{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .bonus-box{
    background: color-mix(in srgb, var(--panel) 50%, transparent);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 6px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .bonus-box.focus{ background: color-mix(in srgb, var(--accent-wash) 50%, transparent); border-color: var(--accent-strong); }
  .bonus-box.base{ border-color: var(--inactive-line); }
  .bonus-box .pct{
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 22px;
  }
  .bonus-box.focus .pct{ color: var(--accent-strong); }
  .bonus-box.base .pct{ color: var(--inactive-ink); }
  .bonus-box .lbl{
    font-size: 9.5px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 2px;
  }

  .stat-chip{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 14px;
    border-radius: 4px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;
    font-weight: 700;
  }
  .stat-chip .pct{ font-size: 15px; }
  .stat-chip.on{ border: 1px solid var(--accent-strong); }
  .stat-chip.on.str{ background: color-mix(in srgb, var(--stat-str-wash) 50%, transparent); color: var(--stat-str); }
  .stat-chip.on.spd{ background: color-mix(in srgb, var(--stat-spd-wash) 50%, transparent); color: var(--stat-spd); }
  .stat-chip.on.def{ background: color-mix(in srgb, var(--stat-def-wash) 50%, transparent); color: var(--stat-def); }
  .stat-chip.on.dex{ background: color-mix(in srgb, var(--stat-dex-wash) 50%, transparent); color: var(--stat-dex); }
  .stat-chip.off{
    background: color-mix(in srgb, var(--panel) 50%, transparent);
    border: 1px solid var(--inactive-line);
    color: var(--inactive-ink);
    font-weight: 600;
  }

  /* Steadfast calendar — 4 cards aligned horizontally */
  .calendar-grid{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .month-card{
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 12px;
    box-shadow: var(--shadow);
  }
  .month-card.is-current{ border-color: var(--accent-strong); box-shadow: var(--shadow), 0 0 0 1px var(--accent-strong); }
  .month-head{
    display: flex;
    flex-direction: row;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .month-name{
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .month-card.is-current .month-name{ color: var(--accent-strong); }
  .month-tag{
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--accent-strong);
    border: 1px solid var(--accent-strong);
    border-radius: 999px;
    padding: 1px 7px;
    width: fit-content;
  }
  .month-card .stat-rows{
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .month-card .stat-chip{ font-size: 12.5px; padding: 7px 9px; }
  .month-card .stat-chip .pct{ font-size: 12.5px; }

  /* Rotation pattern strip (inside Steadfast Bonuses section) */
  .pattern-row{
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
    padding-top: 14px;
    border-top: 1px dashed var(--line-strong);
  }
  .pattern-pair{
    font-family: Georgia, "Times New Roman", serif;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--inactive-ink);
    background: color-mix(in srgb, var(--panel) 50%, transparent);
    border: 1px solid var(--inactive-line);
    border-radius: 999px;
    padding: 5px 12px;
  }
  .pattern-pair.is-current{
    color: var(--accent-strong);
    border-color: var(--accent-strong);
    background: color-mix(in srgb, var(--accent-wash) 50%, transparent);
  }
  .pattern-arrow{
    color: var(--ink-faint);
    font-size: 12px;
  }

  .sponsor{
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    text-align: center;
  }
  .sponsor-label{
    font-size: 9.5px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .sponsor-name{
    font-family: Georgia, "Times New Roman", serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent-strong);
    margin: 6px 0 2px;
  }
  .sponsor-slogan{
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 12px;
    color: var(--ink-dim);
  }

  @media (max-width: 640px){
    .calendar-grid{ grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 420px){
    .bonus-strip{ grid-template-columns: repeat(2, 1fr); }
  }

  @media print{
    body{ background: #fff; padding: 0; }
  }
</style>

<div class="sheet">
  <div class="banner">
    <h1>The Corleone Family</h1>
    <div class="subtitle">Steadfast Rotation &middot; Monthly Focus Cycle</div>
  </div>

  <div class="section-title">
    <h2>Steadfast Bonuses</h2>
  </div>
  <div class="bonus-strip">
    <div class="bonus-box focus"><div class="pct">+9%</div></div>
    <div class="bonus-box focus"><div class="pct">+9%</div></div>
    <div class="bonus-box base"><div class="pct">+5%</div></div>
    <div class="bonus-box base"><div class="pct">+5%</div></div>
  </div>
  <div class="pattern-row" id="pattern-row"></div>

  <div class="section-title">
    <h2>Steadfast Calendar</h2>
  </div>
  <div class="calendar-grid" id="calendar-grid"></div>

  <div class="sponsor">
    <div class="sponsor-label">This page has been brought to you by</div>
    <div class="sponsor-name">Fully Bricked Fitness</div>
    <div class="sponsor-slogan">Get Bricked Today!</div>
  </div>
</div>

<script>
  (function(){
    // Rotation starts at ANCHOR (month is 0-based: 7 = August) and repeats every PAIRS.length months.
    var ANCHOR = { year: 2026, month: 7 };
    var PAIRS = [
      ["str", "dex"],
      ["spd", "def"],
      ["str", "spd"],
      ["def", "dex"]
    ];
    var CARDS = 4;
    var STATS = ["str", "spd", "def", "dex"];
    var NAMES = { str: "Strength", spd: "Speed", def: "Defense", dex: "Dexterity" };
    var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

    function pairIndex(year, month){
      var diff = (year - ANCHOR.year) * 12 + (month - ANCHOR.month);
      return ((diff % PAIRS.length) + PAIRS.length) % PAIRS.length;
    }

    function chip(stat, on){
      return '<div class="stat-chip ' + (on ? "on " : "off ") + stat + '">' +
        NAMES[stat] + ' <span class="pct">' + (on ? "9%" : "5%") + '</span></div>';
    }

    var now = new Date();
    var year = now.getFullYear();
    var month = now.getMonth();
    var current = pairIndex(year, month);

    var pattern = PAIRS.map(function(pair, i){
      return '<span class="pattern-pair' + (i === current ? " is-current" : "") + '">' +
        NAMES[pair[0]] + " + " + NAMES[pair[1]] + '</span><span class="pattern-arrow">&rarr;</span>';
    }).join("") + '<span class="pattern-pair">repeat</span>';
    document.getElementById("pattern-row").innerHTML = pattern;

    var cards = "";
    for (var i = 0; i < CARDS; i++){
      var d = new Date(year, month + i, 1);
      var pair = PAIRS[pairIndex(d.getFullYear(), d.getMonth())];
      var rest = STATS.filter(function(s){ return pair.indexOf(s) === -1; });
      cards += '<div class="month-card' + (i === 0 ? " is-current" : "") + '">' +
        '<div class="month-head"><span class="month-name">' + MONTHS[d.getMonth()] + " " + d.getFullYear() + '</span>' + '</div>' +
        '<div class="stat-rows">' + chip(pair[0], true) + chip(pair[1], true) + chip(rest[0], false) + chip(rest[1], false) + '</div></div>';
    }
    document.getElementById("calendar-grid").innerHTML = cards;
  })();
</script>
